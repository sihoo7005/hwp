name: Android reader

on:
  push:
    branches: [main, "codex/android-*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Prepare rhwp source
        run: bash android/scripts/prepare-rhwp.sh
      - name: Prepare native Korean, math and old Hangul fonts
        run: |
          python -m pip install -r android/scripts/requirements.txt
          python android/scripts/prepare-fonts.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native -> target
          cache-on-failure: true
      - name: Test real HWP3, HWP5 and HWPX documents
        run: bash android/scripts/test-native.sh
      - name: Build native reader
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: bash android/scripts/build-native.sh
      - name: Build APK and run Android lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hwp-reader-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify JNI, native Canvas and page UI on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace
            adb exec-out run-as com.sihoo.hwp tar -C files -cf - visual-checks > android/app/build/visual-checks.tar
            tar -tf android/app/build/visual-checks.tar
      - name: Upload dependency lock and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwp-reader-build-reports
          path: |
            android/native/Cargo.lock
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/visual-checks.tar
            android/native/target/fixtures/rendered/
